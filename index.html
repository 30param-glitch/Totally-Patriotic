<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Totally Patriotic</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Roboto', sans-serif;
}

body {
  display: flex;
  min-height: 100vh;
  background: linear-gradient(to bottom, #b22234 50%, #1e3a8a 50%);
  color: white;
}

/* Sidebar */
.sidebar {
  width: 200px;
  background: #1e3a8a;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sidebar button {
  padding: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  background: #2563eb;
  color: white;
}

.sidebar button:hover {
  background: #1d4ed8;
}

/* Main */
.main {
  flex: 1;
  padding: 20px;
}

header {
  text-align: center;
  font-size: 40px;
  margin-bottom: 20px;
}

/* Sections */
.section {
  display: none;
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 12px;
  animation: fade 0.3s ease-in-out;
}

.section.active {
  display: block;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Buttons */
button {
  cursor: pointer;
}

/* Game cards */
.game-card {
  margin-top: 15px;
  padding: 15px;
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
}

/* Reaction box */
#reactionBox {
  width: 200px;
  height: 200px;
  margin: 20px auto;
  display: none;
  border-radius: 12px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <button onclick="showTab('home')">Home</button>
  <button onclick="showTab('math')">Math</button>
  <button onclick="showTab('social')">Social</button>
  <button onclick="showTab('science')">Science</button>
</div>

<!-- MAIN -->
<div class="main">
  <header>🇺🇸 Totally Patriotic 🇺🇸</header>

  <!-- HOME -->
  <div id="home" class="section active">
    <h2>Welcome</h2>
    <p>Choose a section from the sidebar.</p>
  </div>

  <!-- MATH -->
  <div id="math" class="section">

    <h2>Math Games</h2>

    <div class="game-card">
      <h3>🎯 Reaction Game</h3>
      <button onclick="startReaction()">Start</button>
      <div id="reactionBox"></div>
      <p id="reactionScore"></p>
      <p id="reactionTimer"></p>
    </div>

    <div class="game-card">
      <h3>🐍 Snake</h3>
      <button onclick="startSnake()">Start</button>
      <canvas id="snakeCanvas" width="400" height="400"></canvas>
    </div>

  </div>

  <!-- SOCIAL -->
  <div id="social" class="section">
    <h2>Social Studies</h2>
    <p>More content coming soon 🇺🇸</p>

    <div class="game-card">
      <h3>🎮 Minecraft Server</h3>
      <p>Server IP coming soon!</p>
    </div>
  </div>

  <!-- SCIENCE -->
  <div id="science" class="section">
    <h2>Science</h2>

    <div class="game-card">
      <button onclick="openScience()">Open Science Link</button>
    </div>
  </div>

</div>

<script>

/* ================= TAB SYSTEM ================= */
function showTab(tab) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(tab).classList.add("active");
}

/* ================= SCIENCE LINK ================= */
function openScience() {
  window.open("https://jwm7210.github.io/site-test/drive.html", "_blank");
}

/* ================= REACTION GAME ================= */
let reactionScore = 0;
let timeLeft = 10;
let canClick = false;
let timer;

function startReaction() {
  reactionScore = 0;
  timeLeft = 10;

  document.getElementById("reactionScore").textContent = "Score: 0";
  document.getElementById("reactionTimer").textContent = "Time: 10";

  let box = document.getElementById("reactionBox");
  box.style.display = "block";
  box.style.background = "red";

  canClick = false;

  setTimeout(() => {
    box.style.background = "green";
    canClick = true;

    timer = setInterval(() => {
      timeLeft--;
      document.getElementById("reactionTimer").textContent = "Time: " + timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        canClick = false;
      }
    }, 1000);

  }, 1000);
}

document.getElementById("reactionBox").onclick = function () {
  if (canClick) {
    reactionScore += timeLeft;
    document.getElementById("reactionScore").textContent = "Score: " + reactionScore;
    canClick = false;
  }
};

/* ================= SNAKE (SIMPLE) ================= */
const canvas = document.getElementById("snakeCanvas");
const ctx = canvas.getContext("2d");

let snake = [];
let dx = 20, dy = 0;
let food = { x: 100, y: 100 };
let snakeLoop;

function startSnake() {
  snake = [{ x: 200, y: 200 }];
  dx = 20;
  dy = 0;

  clearInterval(snakeLoop);
  snakeLoop = setInterval(drawSnake, 120);
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") { dx = 0; dy = -20; }
  if (e.key === "ArrowDown") { dx = 0; dy = 20; }
  if (e.key === "ArrowLeft") { dx = -20; dy = 0; }
  if (e.key === "ArrowRight") { dx = 20; dy = 0; }
});

function drawSnake() {
  ctx.clearRect(0, 0, 400, 400);

  let head = { x: snake[0].x + dx, y: snake[0].y + dy };

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    food.x = Math.floor(Math.random() * 20) * 20;
    food.y = Math.floor(Math.random() * 20) * 20;
  } else {
    snake.pop();
  }

  ctx.fillStyle = "lime";
  snake.forEach(s => ctx.fillRect(s.x, s.y, 20, 20));

  ctx.fillStyle = "red";
  ctx.fillRect(food.x, food.y, 20, 20);
}

</script>

</body>
</html>
